<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>문의함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #FFFFFF; --ink: #000000; --gray: #626262; --line: #CFCFCF; --cobalt: #E3361B; --sign: #1F4D3A; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Gothic A1", system-ui, sans-serif; font-size: 16px; line-height: 1.6; word-break: keep-all; }
  :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  input[type=password] { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: 0; background: #fff; }
  button { font: inherit; cursor: pointer; border-radius: 0; }
  .btn { background: var(--cobalt); color: #fff; border: 0; padding: 13px 22px; font-weight: 700; margin-top: 12px; min-height: 48px; }
  .err { color: #B3261E; margin-top: 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .bar button { background: none; border: 1.5px solid var(--line); padding: 8px 14px; min-height: 44px; }
  .count { font-size: 40px; font-weight: 700; line-height: 1.2; }
  .count small { display: block; font-size: 15px; font-weight: 400; color: var(--gray); }
  .list { list-style: none; margin: 24px 0 0; padding: 0; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 0; padding: 18px 16px; margin-bottom: 12px; }
  .item.new { border-left: 4px solid var(--cobalt); }
  .meta { color: var(--gray); font-size: 14px; }
  .name { font-weight: 700; font-size: 18px; margin: 2px 0; }
  .contact { background: none; border: 0; padding: 4px 0; color: var(--cobalt); text-decoration: underline; font-size: 17px; min-height: 40px; }
  .text { white-space: pre-wrap; margin: 8px 0 14px; }
  .states { display: flex; gap: 8px; flex-wrap: wrap; }
  .states button { border: 1.5px solid var(--line); background: #fff; padding: 8px 14px; min-height: 44px; }
  .states button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .empty { color: var(--gray); margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <section id="login">
    <h1>문의함</h1>
    <form id="login-form">
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">들어가기</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </section>

  <section id="box" hidden>
    <div class="bar">
      <h1>문의함</h1>
      <button type="button" id="reload">새로고침</button>
    </div>
    <p class="count"><span id="new-count">0</span><small>아직 연락하지 않은 새 문의</small></p>
    <p class="err" id="box-err" role="alert"></p>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>아직 들어온 문의가 없어요. 사이트 문의 폼으로 테스트 문의를 하나 보내 보세요.</p>
  </section>
</div>

<script>
  const STATUSES = ['새 문의', '연락함', '완료'];
  const KEY = 'admin-pw';
  const $ = (id) => document.getElementById(id);
  const getPw = () => { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } };
  const setPw = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch {} };

  async function call(method, body) {
    const r = await fetch('/api/admin', {
      method,
      headers: { 'x-admin-password': getPw(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { setPw(''); showLogin(j.error || '비밀번호가 맞지 않아요.'); throw new Error('401'); }
    if (!r.ok) throw new Error(j.error || '요청을 처리하지 못했어요.');
    return j;
  }

  function showLogin(msg) {
    $('box').hidden = true; $('login').hidden = false;
    $('login-err').textContent = msg || '';
    $('pw').value = ''; $('pw').focus();
  }

  const fmt = (s) => new Date(s).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  function render(rows) {
    $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
    $('empty').hidden = rows.length > 0;
    const list = $('list'); list.textContent = '';
    rows.forEach((row) => {
      const li = document.createElement('li');
      li.className = 'item' + (row.status === '새 문의' ? ' new' : '');
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = fmt(row.created_at);
      const name = document.createElement('div'); name.className = 'name'; name.textContent = row.name;
      const contact = document.createElement('button'); contact.type = 'button'; contact.className = 'contact'; contact.textContent = row.contact;
      contact.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(row.contact); contact.textContent = row.contact + ' (복사됨)'; setTimeout(() => { contact.textContent = row.contact; }, 1500); }
        catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(contact); s.removeAllRanges(); s.addRange(rg); }
      });
      const text = document.createElement('p'); text.className = 'text'; text.textContent = row.message || '(문의 내용 없음)';
      const states = document.createElement('div'); states.className = 'states';
      STATUSES.forEach((st) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = st;
        b.setAttribute('aria-pressed', String(row.status === st));
        b.addEventListener('click', async () => {
          if (row.status === st) return;
          try { await call('PATCH', { id: row.id, status: st }); load(); }
          catch (e) { if (e.message !== '401') $('box-err').textContent = e.message; }
        });
        states.appendChild(b);
      });
      li.append(meta, name, contact, text, states);
      list.appendChild(li);
    });
  }

  async function load() {
    $('box-err').textContent = '';
    try {
      const j = await call('GET');
      $('login').hidden = true; $('box').hidden = false;
      render(j.rows || []);
    } catch (e) {
      if (e.message === '401') return;
      if (!$('box').hidden) $('box-err').textContent = e.message; else showLogin(e.message);
    }
  }

  $('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('pw').value;
    if (!v) return;
    setPw(v); load();
  });
  $('reload').addEventListener('click', load);
  if (getPw()) load(); else $('pw').focus();
</script>
</body>
</html>
